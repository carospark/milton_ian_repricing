[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "milton_ian"
version = "0.1.0"
description = "Hurricane repricing study: Milton (expectations) and Ian (concentrated loss) at CUSIP level"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]
