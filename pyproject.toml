[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "milton_ian"
version = "0.1.0"
description = "Hurricane repricing study: Ian, Milton, Idalia and Beryl"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "pyyaml>=6", "pyshp>=2.3,<3"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]
